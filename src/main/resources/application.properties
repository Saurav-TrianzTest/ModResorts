# Cloud configuration keys (read from environment, no defaults for secrets)
AZURE_STORAGE_ENDPOINT=${AZURE_STORAGE_ENDPOINT}
AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER:temp-processing}
AZURE_KEYVAULT_URL=${AZURE_KEYVAULT_URL}
AZURE_WEATHER_API_SECRET=${AZURE_WEATHER_API_SECRET}

# Safe logging: prevent SDK wire logs and secrets from being logged
logging.level.com.azure=WARN
logging.level.com.azure.request=WARN
logging.level.com.azure.core=WARN
logging.level.com.azure.storage=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO
