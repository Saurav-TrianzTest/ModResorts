apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modresortsconatinr-ingress
  namespace: modresortsconatinr
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - host: modresortsconatinr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modresortsconatinr-service
                port:
                  number: 80
