version: "3.8"

services:
  modresortsconatinr:
    image: modresortsconatinr:latest
    ports:
      - "8080:8080"
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - JAVA_NAMING_FACTORY_INITIAL=${JAVA_NAMING_FACTORY_INITIAL}
      - JAVA_NAMING_PROVIDER_URL=${JAVA_NAMING_PROVIDER_URL}
      - DATASOURCE_JNDI=${DATASOURCE_JNDI}
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    volumes:
      - ./WebContent:/opt/tomcat/webapps/ROOT
