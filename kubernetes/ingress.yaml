apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: containersanity-ingress
  namespace: containersanity
  labels:
    app: containersanity
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /resorts/health
spec:
  rules:
    - host: containersanity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: containersanity-service
                port:
                  number: 80
