version: "3.8"

services:
  modresorts:
    image: modresorts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modresorts-app
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - SERVER_DISPLAY_NAME=${SERVER_DISPLAY_NAME:-modresorts-server}
      - SERVER_FULL_NAME=${SERVER_FULL_NAME:-modresorts-server/default}
      - JNDI_PROVIDER_URL=${JNDI_PROVIDER_URL:-}
      - DB_URL=${DB_URL:-}
      - DB_USERNAME=${DB_USERNAME:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
    volumes:
      - ./config:/app/config:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/resorts/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge
