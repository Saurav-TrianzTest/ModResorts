apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresorts
  namespace: modresorts
  labels:
    app: modresorts
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresorts
  template:
    metadata:
      labels:
        app: modresorts
    spec:
      containers:
        - name: modresorts
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: modresorts-secrets
                  key: weather-api-key
            - name: CUSTOMER_INFO
              valueFrom:
                secretKeyRef:
                  name: modresorts-secrets
                  key: customer-info
            - name: JNDI_FACTORY
              value: "{{JNDI_FACTORY}}"
            - name: JNDI_PROVIDER_URL
              value: "{{JNDI_PROVIDER_URL}}"
            - name: HOSTNAME
              value: "{{HOSTNAME}}"
            - name: SERVER_NAME
              value: "{{SERVER_NAME}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
