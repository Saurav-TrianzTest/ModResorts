version: '3.8'

services:
  modresorts-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    container_name: modresorts-app
    ports:
      - "8080:8080"
    environment:
      # JVM Configuration
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - CATALINA_OPTS=-Duser.timezone=UTC
      # Application Configuration
      - APP_ENV=docker
      - LOG_LEVEL=INFO
    volumes:
      # Mount logs directory for persistence
      - ./logs:/usr/local/tomcat/logs
      # Mount configuration if needed
      - ./config:/usr/local/tomcat/conf/custom:ro
    networks:
      - modresorts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  modresorts-network:
    driver: bridge

volumes:
  logs:
    driver: local
