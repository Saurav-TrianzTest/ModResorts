version: "3.8"

services:
  modresorts:
    image: modresorts:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modresorts-app
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - SERVER_DISPLAY_NAME=${SERVER_DISPLAY_NAME:-modresorts-container}
      - SERVER_FULL_NAME=${SERVER_FULL_NAME:-modresorts-container-1}
      - SPRING_PROFILES_ACTIVE=docker
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/resorts/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge
