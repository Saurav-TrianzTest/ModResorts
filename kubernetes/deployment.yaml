apiVersion: apps/v1
kind: Deployment
metadata:
  name: containersanity
  namespace: containersanity
  labels:
    app: containersanity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: containersanity
  template:
    metadata:
      labels:
        app: containersanity
    spec:
      containers:
        - name: containersanity
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: containersanity-secrets
                  key: weather-api-key
            - name: JNDI_INITIAL_CONTEXT_FACTORY
              value: "{{JNDI_INITIAL_CONTEXT_FACTORY}}"
            - name: JNDI_PROVIDER_URL
              value: "{{JNDI_PROVIDER_URL}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /resorts/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /resorts/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
