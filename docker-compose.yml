version: "3.8"

services:
  modresorts:
    image: modresorts:2.0.0
    ports:
      - "8080:8080"
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY:?set WEATHER_API_KEY}
      - JNDI_FACTORY=${JNDI_FACTORY}
      - JNDI_PROVIDER_URL=${JNDI_PROVIDER_URL}
      - SERVER_NAME=${SERVER_NAME}
      - HOSTNAME=${HOSTNAME}
    volumes:
      - ./WebContent:/opt/tomcat/webapps/ROOT
