apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresortscontainer
  namespace: modresortscontainer
  labels:
    app: modresortscontainer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresortscontainer
  template:
    metadata:
      labels:
        app: modresortscontainer
    spec:
      containers:
        - name: modresortscontainer
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: modresortscontainer-secrets
                  key: weather-api-key
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: TZ
              value: "UTC"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
